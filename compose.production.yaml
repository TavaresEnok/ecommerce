# Preparação apenas; não autoriza publicação. Use --env-file .env.production.
services:
  api:
    environment: {APP_ENV: production, NODE_ENV: production, LOCAL_MAILBOX: "false"}
  worker:
    environment: {APP_ENV: production}
  web:
    ports: !reset []
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [production]
    environment: {PLATFORM_HOST: "${PLATFORM_HOST:?Configure hostname autorizado}"}
    ports: ["80:80", "443:443"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: {web: {condition: service_healthy}}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
volumes:
  caddy-data:
  caddy-config:
